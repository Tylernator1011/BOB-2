// Straße mit Gehweg und Fahrbahn (vorne)
const ROAD = H - 150, WALK = ROAD - 110;
function drawSidewalk(top) {
  g.fillStyle = '#c9c4bb'; g.fillRect(XL, top, VW, ROAD - top);
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3;
  for (let x = Math.floor(XL / 120) * 120; x < XR + 120; x += 120) { g.beginPath(); g.moveTo(x, top); g.lineTo(x - 30 * (ROAD - top) / 110, ROAD); g.stroke(); }
  for (let y = top + 85; y < ROAD - 20; y += 85) { g.beginPath(); g.moveTo(XL, y); g.lineTo(XR, y); g.stroke(); }
  if (top > FLOOR) { g.fillStyle = '#e8e4dc'; g.fillRect(XL, top - 6, VW, 10); g.fillStyle = LINE; g.fillRect(XL, top - 8, VW, 3); }
}
function drawRoad() {
  g.fillStyle = '#e8e4dc'; g.fillRect(XL, ROAD, VW, 16); g.fillStyle = LINE; g.fillRect(XL, ROAD + 14, VW, 4);
  g.fillStyle = '#4a4a4f'; g.fillRect(XL, ROAD + 18, VW, H - ROAD - 18);
  g.fillStyle = '#fff';
  for (let x = 30 + Math.floor((XL - 30) / 160) * 160; x < XR; x += 160) g.fillRect(x, ROAD + 80, 90, 10);
}
function drawBankFacade() {

  for (const tx of [-560, -380, 1600, 1780]) {
    g.fillStyle = '#8a4316'; g.fillRect(tx - 14, FLOOR - 120, 28, 120); g.strokeRect(tx - 14, FLOOR - 120, 28, 120);

  }
  const X0 = -240, X1 = 1440, top = 150;
  g.lineWidth = 6; g.strokeStyle = LINE;
  // Gebäude
  g.fillStyle = '#efe6cf'; g.fillRect(X0, top, X1 - X0, FLOOR - top); g.strokeRect(X0, top, X1 - X0, FLOOR - top);
  // Giebel
  g.fillStyle = '#e2d6b6'; g.beginPath(); g.moveTo(X0 - 40, top + 4); g.lineTo(600, 6); g.lineTo(X1 + 40, top + 4); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#d8cba8'; g.fillRect(X0 - 40, top - 6, X1 - X0 + 80, 34); g.strokeRect(X0 - 40, top - 6, X1 - X0 + 80, 34);
  // Schild
  g.fillStyle = '#1f4f9e'; g.beginPath(); g.roundRect(430, 54, 340, 74, 12); g.fill(); g.stroke();
  marker('BoB BANK', 600, 92, 54, '#ffcc1a');
  // Münze im Giebel
  g.fillStyle = '#ffcc1a'; g.beginPath(); g.arc(600, 196, 0, 0, 7); g.fill();
  // Säulen
  for (let x = X0 + 60; x < X1 - 40; x += 150) {
    if (x > 440 && x < 740) continue;
    g.fillStyle = '#fbf6ea'; g.fillRect(x, top + 50, 54, FLOOR - top - 70); g.strokeRect(x, top + 50, 54, FLOOR - top - 70);
    g.fillStyle = '#e2d6b6'; g.fillRect(x - 10, top + 30, 74, 22); g.strokeRect(x - 10, top + 30, 74, 22);
    g.fillRect(x - 10, FLOOR - 24, 74, 22); g.strokeRect(x - 10, FLOOR - 24, 74, 22);
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3; for (const dx of [14, 27, 40]) { g.beginPath(); g.moveTo(x + dx, top + 56); g.lineTo(x + dx, FLOOR - 28); g.stroke(); }
    g.lineWidth = 6; g.strokeStyle = LINE;
  }
  // Fenster zwischen den Säulen
  for (let x = X0 + 128; x < X1 - 100; x += 150) {
    if (x > 380 && x < 760) continue;

  g.fillStyle = '#d8cba8'; g.fillRect(450, FLOOR - 16, 300, 16); g.strokeRect(450, FLOOR - 16, 300, 16);

function drawStreet(R) {
  const sky = g.createLinearGradient(0, 0, 0, FLOOR);
  sky.addColorStop(0, '#5fb8ff'); sky.addColorStop(1, '#c8ecff');
  g.fillStyle = sky; g.fillRect(XL, 0, VW, FLOOR);
  g.fillStyle = '#fff';
  for (const [cx, cy] of [[160, 80], [900, 120]]) { g.beginPath(); g.arc(cx, cy, 30, 0, 7); g.arc(cx + 38, cy - 10, 40, 0, 7); g.arc(cx + 80, cy, 30, 0, 7); g.fill(); }
  g.lineWidth = 6; g.strokeStyle = LINE;
  if (R.facade === 'bank') drawBankFacade();
  else if (R.facade === 'moebel') {
    for (const tx of [90, 330]) {
      g.fillStyle = '#8a4316'; g.fillRect(tx - 14, FLOOR - 120, 28, 120); g.strokeRect(tx - 14, FLOOR - 120, 28, 120);
      g.fillStyle = '#1fa830'; g.beginPath(); g.arc(tx, FLOOR - 160, 70, 0, 7); g.fill(); g.stroke();
    }
    g.fillStyle = '#ffd200'; g.fillRect(480, 70, 720, FLOOR - 70); g.strokeRect(480, 70, 720, FLOOR - 70);
    g.fillStyle = '#e0262b'; g.fillRect(470, 40, 740, 90); g.strokeRect(470, 40, 740, 90);
    marker('MÖBELHAUS', 840, 88, 64, '#fff');
    for (const [wx, ww] of [[520, 220], [1000, 170]]) {
      g.fillStyle = '#c4f0fc'; g.fillRect(wx, 170, ww, 220); g.strokeRect(wx, 170, ww, 220);
      g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.moveTo(wx + 10, 180); g.lineTo(wx + 60, 180); g.lineTo(wx + 10, 260); g.fill();
    }
    drawFurn('sofa', 640, 380, 0.62, 1, 0);
    drawFurn('lampe', 1085, 384, 0.7, 1, 0);
    g.lineWidth = 6; g.strokeStyle = LINE;
  } else if (R.shop) {
    // kleine Häuser daneben
    g.fillStyle = '#ffb6c9'; g.fillRect(40, 200, 260, FLOOR - 200); g.strokeRect(40, 200, 260, FLOOR - 200);
    g.fillStyle = '#c4f0fc'; g.fillRect(90, 250, 70, 70); g.strokeRect(90, 250, 70, 70); g.fillRect(190, 250, 70, 70); g.strokeRect(190, 250, 70, 70);
    // der Tierladen
    g.fillStyle = '#ffd84a'; g.fillRect(560, 110, 600, FLOOR - 110); g.strokeRect(560, 110, 600, FLOOR - 110);
    g.fillStyle = '#ff5a2a'; g.fillRect(540, 70, 640, 50); g.strokeRect(540, 70, 640, 50);
    g.fillStyle = '#fff'; g.fillRect(700, 28, 320, 62); g.strokeRect(700, 28, 320, 62);
    marker('Tierladen', 860, 60, 44, '#111');
    for (const wx of [600, 980]) {
      g.fillStyle = '#c4f0fc'; g.fillRect(wx, 170, 140, 140); g.strokeRect(wx, 170, 140, 140);
      // Pfote im Schaufenster
      g.fillStyle = '#8a4316';
      g.beginPath(); g.ellipse(wx + 70, 258, 26, 22, 0, 0, 7); g.fill();
      for (const [px, py] of [[-30, -28], [-10, -44], [12, -44], [32, -28]]) { g.beginPath(); g.arc(wx + 70 + px, 258 + py, 11, 0, 7); g.fill(); }
    }
  } else {
    // Bäume und Hecke
    g.fillStyle = '#3fae3a'; g.fillRect(XL, FLOOR - 70, VW, 70); g.strokeRect(XL - 10, FLOOR - 70, VW + 20, 70);
    for (const tx of [120, 420, 1080]) {
      g.fillStyle = '#8a4316'; g.fillRect(tx - 14, FLOOR - 170, 28, 120); g.strokeRect(tx - 14, FLOOR - 170, 28, 120);
      g.fillStyle = '#1fa830'; g.beginPath(); g.arc(tx, FLOOR - 210, 70, 0, 7); g.fill(); g.stroke();
    }
  }
  if (R.grass) {
    const gr = g.createLinearGradient(0, FLOOR, 0, WALK);
    gr.addColorStop(0, '#45c43a'); gr.addColorStop(1, '#5fd64f');
    g.fillStyle = gr; g.fillRect(XL, FLOOR, VW, WALK - FLOOR);
    drawSidewalk(WALK);
  } else drawSidewalk(FLOOR);
  g.fillStyle = LINE; g.fillRect(XL, FLOOR - 3, VW, 6);
  drawRoad();
}

// Regal wie in der Zeichnung: graue Rückwand, drei dunkle Böden, Sachen für Tiere
function rnd(seed) { let t = seed * 9301 + 49297; return () => ((t = (t * 9301 + 49297) % 233280) / 233280); }
const ITEM_COLS = ['#ff4d4d', '#3b82f6', '#ffb000', '#9b5de5', '#13c000', '#ff7ac6', '#00b3b3'];
function drawItems(x0, x1, y, r) {
  let x = x0 + 10;
  while (x < x1 - 40) {
    const k = r(), col = ITEM_COLS[Math.floor(r() * ITEM_COLS.length)];
    g.lineWidth = 3; g.strokeStyle = LINE;
    if (k < 0.5) { // Futtersack
      const w = 44 + r() * 12, h = 58 + r() * 10;
      g.fillStyle = col; g.beginPath(); g.roundRect(x, y - h, w, h, [10, 10, 4, 4]); g.fill(); g.stroke();
      g.fillStyle = '#fff'; g.fillRect(x + 7, y - h * 0.62, w - 14, h * 0.34);
      g.fillStyle = '#8a4316'; g.beginPath(); g.arc(x + w / 2, y - h * 0.44, 6, 0, 7); g.fill();
      x += w + 8;
    } else if (k < 0.82) { // Dosen
      for (let i = 0; i < 2; i++) {
        g.fillStyle = col; g.fillRect(x, y - 36, 28, 36); g.strokeRect(x, y - 36, 28, 36);
        g.fillStyle = '#ddd'; g.fillRect(x, y - 36, 28, 6); x += 32;
      }
      x += 6;
    } else { // Ball / Spielzeug
      g.fillStyle = col; g.beginPath(); g.arc(x + 16, y - 16, 16, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(x + 16, y - 16, 9, 0.6, 2.6); g.stroke();
      x += 40;
    }
  }
}
function drawShelf(o) {
  const top = o.base - o.h, r = rnd(o.seed);
  g.lineWidth = 4; g.strokeStyle = LINE;
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(o.x + 10, o.base - 6, o.w + 20, 14);
  g.fillStyle = '#737373'; g.fillRect(o.x, top, o.w, o.h); g.strokeRect(o.x, top, o.w, o.h);
  for (const f of [0.08, 0.4, 0.71]) {
    const by = top + o.h * f + 40;
    drawItems(o.x + 6, o.x + o.w - 6, by, r);
    g.fillStyle = '#2e2e2e'; g.fillRect(o.x - 6, by, o.w + 30, 16); g.lineWidth = 4; g.strokeStyle = LINE; g.strokeRect(o.x - 6, by, o.w + 30, 16);
  }
}
function drawKasse(o) {
  const top = o.base - o.h;
  g.lineWidth = 5; g.strokeStyle = LINE;
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(o.x + 10, o.base - 6, o.w + 10, 16);
  // Theke: braun mit roter Platte (wie im alten Spiel)
  g.fillStyle = '#8b4a1e'; g.fillRect(o.x, top + 30, o.w, o.h - 30); g.strokeRect(o.x, top + 30, o.w, o.h - 30);
  g.fillStyle = '#ff1a1a'; g.fillRect(o.x - 10, top, o.w + 20, 34); g.strokeRect(o.x - 10, top, o.w + 20, 34);
  // Kasse mit schwarzem Bildschirm und grünem Licht
  const kx = o.x + o.w - 150, ky = top - 90;
  g.fillStyle = '#cfcfcf'; g.fillRect(kx, ky, 120, 90); g.strokeRect(kx, ky, 120, 90);
  const sg = g.createLinearGradient(kx + 12, 0, kx + 108, 0); sg.addColorStop(0, '#000'); sg.addColorStop(1, '#3a3a3a');
  g.fillStyle = sg; g.fillRect(kx + 12, ky + 12, 96, 48); g.strokeRect(kx + 12, ky + 12, 96, 48);
  const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 400);
  g.save(); g.shadowColor = '#3cff3c'; g.shadowBlur = 14 * pulse;

// Bild auf ein Parallelogramm legen: Ursprung o, Kante u (Breite), Kante v (Höhe)
function petFace(img, sx, sy, sw, sh, ox, oy, ux, uy, vx, vy, shade) {
  g.save(); g.transform(ux, uy, vx, vy, ox, oy);
  g.drawImage(img, sx, sy, sw, sh, 0, 0, 1, 1);
  if (shade) { g.fillStyle = shade; g.fillRect(0, 0, 1, 1); }
  g.restore();
  g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + ux, oy + uy); g.lineTo(ox + ux + vx, oy + uy + vy); g.lineTo(ox + vx, oy + vy); g.closePath(); g.stroke();
}
// Tier-Würfel: Fußpunkt (x, y), Breite w, t = Drehung (1 Seite links, -1 Seite rechts)
function drawPetCube(id, x, y, w, t, hop) {
  const p = PETS[id], img = p.img;
  if (!img.complete || !img.width) return;
  const iw = img.width, ih = img.height, h = w * ih / iw, d = w * 0.16, dx = -d * t, dy = -d * 0.55;
  const wid = 0.82 + 0.18 * Math.abs(t), fw = w * wid;
  g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(x, y + 3, fw * 0.6, w * 0.08, 0, 0, 7); g.fill();
  const x0 = x - fw / 2 + d * 0.5 * t, y0 = y - h + hop;
  g.lineWidth = 3.5; g.strokeStyle = LINE; g.lineJoin = 'round';
  const strip = Math.max(4, iw * 0.12);
  // Seite: Randstreifen des Bildes, abgedunkelt
  if (Math.abs(dx) > 0.5) {
    if (dx < 0) petFace(img, 0, 0, strip, ih, x0, y0, dx, dy, 0, h, 'rgba(0,0,0,.32)');
    else petFace(img, iw - strip, 0, strip, ih, x0 + fw, y0, dx, dy, 0, h, 'rgba(0,0,0,.32)');
  }
  // Oberseite: oberer Bildstreifen, leicht abgedunkelt
  petFace(img, 0, 0, iw, Math.max(4, ih * 0.12), x0, y0, fw, 0, dx, dy, 'rgba(0,0,0,.12)');
  // Vorderseite: das Bild
  petFace(img, 0, 0, iw, ih, x0, y0, fw, 0, 0, h, null);
}

function saveOwned() { try { localStorage.setItem('bob-tiere', JSON.stringify(owned)); localStorage.setItem('bob-tier-aktiv', activePet || ''); } catch (e) {} }
function activeList() { return activePet && owned.includes(activePet) ? [activePet] : []; }
// Kleidung pro Tier (bis jetzt nur „Normal“)
const PET_OUTFITS = { normal: { name: 'Normal' } };

try { petWear = JSON.parse(localStorage.getItem('bob-tier-kleidung') || '{}') || {}; } catch (e) {}

function savePetWear() { try { localStorage.setItem('bob-tier-kleidung', JSON.stringify(petWear)); } catch (e) {} }

// Tiere im Haus laufen herum
const HOUSE = ['spawn'];
const petState = {};
let petPos = {};
try { petPos = JSON.parse(localStorage.getItem('bob-tier-pos') || '{}') || {}; } catch (e) {}
addEventListener('beforeunload', () => { try { savePetStats(); } catch (e) {} });
function savePetPos() {
  for (const id in petState) { const p = petState[id]; petPos[id] = { room: p.room, x: Math.round(p.x), y: Math.round(p.y), mode: p.mode || 'home' }; }
  try { localStorage.setItem('bob-tier-pos', JSON.stringify(petPos)); } catch (e) {}
}
function petFor(id) {
  if (!petState[id]) {
    const sv = petPos[id];
    petState[id] = { id, room: 'spawn', x: 300 + Math.random() * 600, y: 600 + Math.random() * 150, tx: 0, ty: 0, wait: 1, face: 1, turn: 1, phase: Math.random() * 6, moving: false, mode: 'home' };
    if (sv && ROOMS[sv.room]) {
      const p = petState[id];
      if (sv.mode === 'gassi' || sv.mode === 'tragen') { p.mode = sv.mode; p.room = cur; p.x = bob.x - 150; p.y = bob.y; }
      else { p.room = sv.room; p.x = sv.x; p.y = sv.y; }
    }
  }
  return petState[id];
}
// gefüllten Napf im Raum suchen
function fullNapf(room) { return (furn[room] || []).find(f => f.t === 'napf' && f.food); }
function updatePets(dt) {
  if (muellShake > 0) muellShake = Math.max(0, muellShake - dt);
  tickPetStats(dt);
  for (const id of activeList()) {
    const p = petFor(id); p.mode = p.mode || 'home';
    if (p.mode === 'gassi' || p.mode === 'tragen') {
      p.room = cur;
      if (p.mode === 'tragen') { p.x = bob.x; p.y = bob.y; p.moving = bob.moving; p.face = bob.face; }
      else {
        const tx = bob.x - bob.face * 160 * scaleAt(bob.y), ty = bob.y + 8, ddx = tx - p.x, ddy = ty - p.y, m = Math.hypot(ddx, ddy);
        if (m > 500) { p.x = tx; p.y = ty; }
        else if (m > 24) { const sp = Math.min(m * 3, 460); p.x += ddx / m * sp * dt; p.y += ddy / m * sp * dt; p.moving = true; if (ddx < -3) p.face = -1; else if (ddx > 3) p.face = 1; }
        else p.moving = false;
      }
      if (p.eat && p.mode === 'gassi') p.eat = null;
    } else if (p.eat) {
      const e = p.eat, ddx = e.x - p.x, ddy = e.y - p.y, m = Math.hypot(ddx, ddy);
      if (!e.eating && m > 8) { p.x += ddx / m * 170 * dt; p.y += ddy / m * 140 * dt; p.moving = true; p.face = ddx < 0 ? -1 : 1; }
      else {
        e.eating = true; p.moving = false; p.face = -1; e.t -= dt;
        if (e.t <= 0) {
          if (e.napf) { if (!e.napf.food) { p.eat = null; p.wait = 1; continue; } e.lvl = e.napf.food; e.napf.food = null; saveFurn(); }
          const st = statsOf(id), F = FOODS[e.lvl || 1]; st.hunger = Math.min(100, st.hunger + F.hunger); p.eat = null; addXp(id, F.xp); p.wait = 1.5;
          if (F.gold) { st.goldUntil = gt.T + GOLD_MIN; st.goldAcc = 0; toast = { text: PETS[id].name + ' ist im Goldmodus und kackt jetzt Geld!', t: 4 }; }
          else toast = { text: PETS[id].name + ' hat gegessen! +' + F.xp + ' XP', t: 3 };
          savePetStats();
        }
      }
    } else {
      const nf = statsOf(id).hunger < 75 && fullNapf(p.room);
      if (nf) { p.eat = { x: nf.x + 80 * scaleAt(nf.y), y: nf.y + 6, t: 2.5, eating: false, napf: nf }; }
      else if (p.wait > 0) { p.wait -= dt; p.moving = false; if (p.wait <= 0) { p.tx = XL + 140 + Math.random() * (VW - 280); p.ty = FLOOR + 80 + Math.random() * (H - FLOOR - 120); } }
      else {
        const ddx = p.tx - p.x, ddy = p.ty - p.y, m = Math.hypot(ddx, ddy), sp = 120;
        if (m < 6) { p.wait = 1 + Math.random() * 3; p.moving = false; }
        else { const nx = p.x + ddx / m * sp * dt, ny = p.y + ddy / m * sp * 0.8 * dt, pw = PETS[id].w * scaleAt(ny) * 0.4;
          if (blocked(nx, ny, pw, p.room)) { p.wait = 0.3; p.moving = false; }
          else { p.x = nx; p.y = ny; p.moving = true; if (ddx < -3) p.face = -1; else if (ddx > 3) p.face = 1; } }
      }
    }
    p.phase += dt * (p.moving ? 10 : p.eat && p.eat.eating ? 14 : 2);
    const st = dt * 8; p.turn += Math.max(-st, Math.min(st, p.face - p.turn));
  }
}
function drawPet(p) {
  const s = scaleAt(p.y);
  if (p.mode === 'tragen') {
    const bobS = BASE_W / BODY.w * s, hop = bob.moving ? -Math.abs(Math.sin(bob.phase)) * 9 * s : 0;
    drawPetCube(p.id, bob.x + bob.face * 30 * s, bob.y - 40 * s + hop, PETS[p.id].w * s * 0.72, p.turn, 0);
    return;
  }
  const eating = p.eat && p.eat.eating, hop = eating ? Math.abs(Math.sin(p.phase)) * 4 * s : p.moving ? -Math.abs(Math.sin(p.phase)) * 8 * s : Math.sin(p.phase) * 1.2;
  drawPetCube(p.id, p.x, p.y, PETS[p.id].w * s, p.turn, hop);
}

function drawCage(o) {
  const top = o.base - o.h;
  g.lineWidth = 5; g.strokeStyle = LINE;
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(o.x + 10, o.base - 4, o.w + 10, 14);
  // Rückwand und Stroh
  g.fillStyle = '#5c4a3a'; g.fillRect(o.x, top, o.w, o.h); g.strokeRect(o.x, top, o.w, o.h);
  g.fillStyle = '#f2cf5b'; g.fillRect(o.x, o.base - 40, o.w, 40);
  g.strokeStyle = '#c9a43a'; g.lineWidth = 3;
  for (let i = 0; i < 14; i++) { const sx = o.x + 10 + i * (o.w - 20) / 13; g.beginPath(); g.moveTo(sx, o.base - 6); g.lineTo(sx + 12, o.base - 30); g.stroke(); }

// Bob als sauberer Würfel (Maße in Einheiten der alten Zeichnung)
const BODY = { w: 252, h: 150 }, HEAD = { w: 240, h: 178 }, DEPTH = 34;

function poly(pts, fill) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath(); g.fillStyle = fill; g.fill(); g.stroke();
}

// Würfel: Vorderseite + linke Seite + Oberseite
// t = 1: Seite links (schaut nach rechts), t = -1: Seite rechts (schaut nach links)
function cube(x, y, w, h, d, col, showTop, t) {
  const dx = -d * t, dy = -d * 0.55;
  // Seite
  const ex = dx < 0 ? x : x + w;
  const sg = g.createLinearGradient(ex + dx, 0, ex, 0);
  sg.addColorStop(0, col.side2); sg.addColorStop(1, col.side);
  if (Math.abs(dx) > 0.5) poly([[ex, y], [ex + dx, y + dy], [ex + dx, y + h + dy], [ex, y + h]], sg);
  // Oberseite
  if (showTop) {
    const tg = g.createLinearGradient(0, y + dy, 0, y);
    tg.addColorStop(0, col.top2); tg.addColorStop(1, col.top);
    poly([[x, y], [x + dx, y + dy], [x + w + dx, y + dy], [x + w, y]], tg);
  }
  // Vorderseite
  const fg = g.createLinearGradient(x, y, x + w, y + h);
  fg.addColorStop(0, col.front2); fg.addColorStop(1, col.front);
  poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fg);
}

function mkPal(a, b) { return { front: a, front2: b || shade(a, 0.25), side: shade(a, -0.28), side2: shade(a, -0.45), top: shade(a, -0.1), top2: shade(a, -0.2) }; }
const GAL = { front: '#6b70ff', front2: '#b38cff', side: '#5a4ad6', side2: '#4436b0', top: '#a28cff', top2: '#9078f0' };
function stars(x, y, w, h, seed, n) {
  let r = seed * 9301 + 49297;
  const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  for (let i = 0; i < n; i++) {
    const sx = x + 12 + rnd() * (w - 24), sy = y + 12 + rnd() * (h - 24), sr = 6 + rnd() * 5;
    g.fillStyle = i === 0 ? '#d8d8d8' : '#fff'; g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
  }
}
function inf(x, y, s, col, lw) { // Unendlich-Zeichen
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = col; g.lineWidth = lw / s; g.lineCap = 'round';
  g.beginPath(); for (let a = 0; a <= 6.3; a += 0.15) { const d = 1 + Math.sin(a) ** 2, px = 20 * Math.cos(a) / d, py = 20 * Math.sin(a) * Math.cos(a) / d; a ? g.lineTo(px, py) : g.moveTo(px, py); } g.closePath(); g.stroke();
  g.restore();
}
function bobFace(hx, hy) { if (face.complete && face.width) g.drawImage(face, hx + 12, hy + 18); }
function glove(x, y, col, flip) {
  g.save(); g.translate(x, y); g.scale(flip ? -1 : 1, 1);
  g.fillStyle = col; g.strokeStyle = '#111'; g.lineWidth = 5;
  g.beginPath(); g.ellipse(0, 0, 46, 52, 0.2, 0, 7); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(30, 18, 16, 24, -0.4, 0, 7); g.fill(); g.stroke();
  g.fillStyle = shade(col, 0.35); g.beginPath(); g.ellipse(-14, -18, 14, 10, -0.5, 0, 7); g.fill();
  g.restore();
}
function blob(cx, cy, rx, ry, col) {
  g.fillStyle = col; g.beginPath();
  for (let a = 0; a <= 6.3; a += 0.3) { const r = 1 + 0.06 * Math.sin(a * 5), px = cx + Math.cos(a) * rx * r, py = cy + Math.sin(a) * ry * r; a ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath(); g.fill();
}

  if (shadow) {

  }

  if (of.custom) { of.custom(t, k); g.restore(); return; }
  if (of.back) { g.save(); of.back(bx, by, hx, hy, t); g.restore(); reset(); }

    // Schürze mit Pfote (Arbeitskleidung)

  }
  if (of.bodyFront) { g.save(); g.beginPath(); g.rect(bx - 40, by - 40, BODY.w + 80, BODY.h + 40); g.clip(); of.bodyFront(bx, by, BODY.w, BODY.h); g.restore(); reset(); g.strokeRect(bx, by, BODY.w, BODY.h); }
