name: BOB 2 bauen und veröffentlichen

# Läuft bei jedem Hochladen auf main. Neues Release gibt es nur,
# wenn die Version in package.json neu ist (sonst wird übersprungen).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version prüfen
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $V gibt es schon – nichts zu tun."
            echo "neu=nein" >> "$GITHUB_OUTPUT"
          else
            echo "neu=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Pakete installieren
        if: steps.ver.outputs.neu == 'ja'
        run: npm install

      - name: Installer bauen und als Release hochladen
        if: steps.ver.outputs.neu == 'ja'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
